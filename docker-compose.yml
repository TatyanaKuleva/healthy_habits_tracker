
services:
  db:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 1s
      retries: 5


  backend:
    build: .
    command: bash -c "python manage.py migrate && python manage.py collectstatic -c --no-input && python manage.py runserver 0.0.0.0:8080"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - .:/code
      - django_static:/app/static
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/admin/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s




  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
#      - django_static:/usr/share/nginx/html/
      - django_static:/code/static

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      HOST: db
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info -S django
#    celery -A YOUR_DJANGO_PROJECT_NAME beat --loglevel=info
    env_file:
        - .env
    environment:
      POSTGRES_HOST: db
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/code




volumes:
  postgres_data:
  django_static:
